name: Update papers

# 정기 수집은 연구실 서버의 cron(scripts/cron_update.sh)에서 한다.
# usenix.org가 GitHub Actions IP를 403으로 막기 때문. 여기서는 수동 실행만 남겨둔다
# (수동 실행 시 USENIX 학회는 실패하고 기존 데이터가 유지된다).
on:
  workflow_dispatch:
    inputs:
      full:
        description: "모든 연도 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect papers
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python tracker/update.py ${{ inputs.full && '--full' || '' }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update papers $(date -u +%F)"
            git push
          fi
